name: Bug report
description: Report a reproducible issue in contracts, tests, scripts, or documentation.
title: "[bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, inputs, or reasoning needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Any checks already run.
